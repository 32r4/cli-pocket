[workspace]
resolver = "2"
members = [
    "crates/shared/proto",
    "crates/shared/crypto",
    "crates/shared/transport",
    "crates/server/pty",
    "crates/server/daemon-core",
    "crates/server/daemon-bin",
    "crates/relay/relay-core",
    "crates/relay/relay-bin",
    "crates/client/client-core",
    "crates/client/client-core-wasm",
    "crates/client/tauri-app",
    "crates/client/tauri-bindings",
    "apps/desktop/src-tauri",
    "apps/mobile/src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/32r4/cli-pocket"
authors = ["cli-pocket contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Stylistic pedantic lints suppressed workspace-wide so `just check` gate stays
# green during scaffold-to-fleshed-out churn. Re-enable in focused follow-ups.
unused_async = "allow"
too_many_lines = "allow"
single_match_else = "allow"
manual_let_else = "allow"
doc_markdown = "allow"
redundant_closure_for_method_calls = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# Serialization
postcard       = { version = "1", default-features = false, features = ["use-std"] }
serde          = { version = "1", features = ["derive"] }
serde_bytes    = "0.11"
serde_json     = "1"

# Crypto
snow           = { version = "0.9", default-features = false, features = ["default-resolver"] }
spake2         = "0.4"
rand_core      = { version = "0.6", features = ["std"] }
# Crypto crates must depend on `getrandom = { workspace = true }` to activate wasm `js`
# support for transitive `snow` / `spake2` random use.
getrandom      = { version = "0.2", features = ["js"] }

# Async runtime / transport
tokio              = { version = "1", features = ["rt", "macros", "sync", "time", "io-util", "net"] }
tokio-tungstenite  = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util       = "0.3"
futures-channel    = { version = "0.3", features = ["sink"] }
async-trait        = "0.1"

# Errors / logging / id
thiserror      = "1"
tracing        = "0.1"
uuid           = { version = "1", features = ["v7", "serde", "js"] }
bytes          = { version = "1", features = ["serde"] }
base64         = "0.22"
toml           = "0.9.8"

# Utilities used by plan C+ but pinned now for version stability
notify         = "6"
vte            = "0.13"
portable-pty   = "0.9"
clap           = { version = "4", features = ["derive", "env"] }

# Platform directories (XDG / macOS / Windows data dirs)
directories    = "5"

# Dev-only (not in regular deps)
proptest       = "1"
tempfile       = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
