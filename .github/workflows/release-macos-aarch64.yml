name: release macos-aarch64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading v)"
        required: true

jobs:
  build:
    uses: ./.github/workflows/release-platform.yml
    with:
      version: ${{ inputs.version }}
      name: macos-aarch64
      label: macOS arm64
      os: macos-14
      target: aarch64-apple-darwin
      artifact_target: macos-arm64
      build_daemon: true
      build_relay: true
      build_desktop: true
      build_web: false
      build_android: false
      build_ios: false
      node_required: true
      tauri_required: true
      wasm_pack_install: none
      tauri_bundles: dmg,app
    secrets: inherit
