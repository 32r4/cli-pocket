name: deploy-relay-cloudflare

on:
  push:
    branches: [main]
    paths:
      - "workers/relay-cloudflare/**"
      - ".github/workflows/deploy-relay-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/relay-cloudflare/package-lock.json

      - name: Install relay-cloudflare dependencies
        run: npm --prefix workers/relay-cloudflare ci

      - name: Typecheck relay-cloudflare
        run: npm --prefix workers/relay-cloudflare run build

      - name: Deploy relay-cloudflare worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/relay-cloudflare
          command: deploy
        env:
          SERVER_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_RELAY_SERVER_AUTH_TOKEN }}
