name: release-platform

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      target:
        required: true
        type: string
      build_daemon:
        required: true
        type: boolean
      build_relay:
        required: true
        type: boolean
      build_desktop:
        required: true
        type: boolean
      build_web:
        required: true
        type: boolean
      build_android:
        required: true
        type: boolean
      build_ios:
        required: true
        type: boolean
      node_required:
        required: true
        type: boolean
      tauri_required:
        required: true
        type: boolean
      wasm_pack_install:
        required: true
        type: string
      tauri_bundles:
        required: true
        type: string

permissions:
  contents: read

env:
  HAS_MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
  HAS_MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD != '' }}
  MINISIGN_VERSION: "0.12"

jobs:
  build:
    name: build (${{ inputs.name }})
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check mobile scaffold
        id: mobile
        shell: bash
        run: |
          if [ -f apps/mobile/src-tauri/tauri.conf.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !inputs.build_ios }}
        with:
          targets: ${{ inputs.target == 'android' && 'aarch64-linux-android' || inputs.target }}

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ inputs.build_ios }}

      - name: Install explicit Rust target (linux aarch64)
        if: inputs.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Add cross-linker (linux aarch64)
        if: inputs.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - uses: actions/setup-node@v4
        if: inputs.node_required
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/app/package-lock.json

      - name: Select Xcode 16 (macos)
        if: runner.os == 'macOS' && (inputs.build_desktop || inputs.build_ios)
        shell: bash
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode 16 installation found on runner." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install Tauri prerequisites (linux)
        if: runner.os == 'Linux' && (inputs.build_desktop || inputs.build_android)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libssl-dev pkg-config librsvg2-dev

      - name: Install wasm-pack (unix)
        if: inputs.wasm_pack_install == 'shell' && runner.os != 'Windows'
        shell: bash
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-pack (windows)
        if: inputs.wasm_pack_install == 'shell' && runner.os == 'Windows'
        shell: bash
        run: cargo install wasm-pack --locked

      - name: Install tauri-cli
        if: inputs.tauri_required
        shell: bash
        run: cargo install tauri-cli --version "^2.1" --locked

      - name: Install minisign (linux)
        if: runner.os == 'Linux' && env.HAS_MINISIGN_SECRET_KEY == 'true' && env.HAS_MINISIGN_PASSWORD == 'true'
        shell: bash
        run: |
          curl -fsSL -o minisign.tar.gz "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz"
          tar -xzf minisign.tar.gz
          sudo install -m 755 "minisign-linux/$(uname -m)/minisign" /usr/local/bin/minisign

      - name: Install minisign (macos)
        if: runner.os == 'macOS' && env.HAS_MINISIGN_SECRET_KEY == 'true' && env.HAS_MINISIGN_PASSWORD == 'true'
        shell: bash
        run: brew install minisign

      - name: Install minisign (windows)
        if: runner.os == 'Windows' && env.HAS_MINISIGN_SECRET_KEY == 'true' && env.HAS_MINISIGN_PASSWORD == 'true'
        shell: powershell
        run: choco install minisign -y

      - name: Materialise signing key
        if: env.HAS_MINISIGN_SECRET_KEY == 'true'
        shell: bash
        env:
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          printf '%s' "$KEY" > cli-pocket-minisign.key
          chmod 600 cli-pocket-minisign.key

      - name: Build daemon
        if: inputs.build_daemon
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        shell: bash
        run: bash scripts/release/build-daemon.sh

      - name: Build relay
        if: inputs.build_relay
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        shell: bash
        run: bash scripts/release/build-relay.sh

      - name: Build desktop
        if: inputs.build_desktop
        env:
          VERSION: ${{ inputs.version }}
          TAURI_BUNDLES: ${{ inputs.tauri_bundles }}
        shell: bash
        run: bash scripts/release/build-desktop.sh

      - name: Build web
        if: inputs.build_web
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: bash scripts/release/build-web.sh

      - name: Setup Java
        if: inputs.build_android && steps.mobile.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        if: inputs.build_android && steps.mobile.outputs.enabled == 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Materialise Android keystore
        if: inputs.build_android && steps.mobile.outputs.enabled == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; Android release APKs will be unsigned."
            exit 0
          fi
          mkdir -p apps/mobile/src-tauri/gen/android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/src-tauri/gen/android/release.keystore
          echo "ANDROID_KEYSTORE_PATH=$PWD/apps/mobile/src-tauri/gen/android/release.keystore" >> "$GITHUB_ENV"

      - name: Build mobile (android)
        if: inputs.build_android
        env:
          VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: bash scripts/release/build-mobile-android.sh

      - name: Build mobile (ios)
        if: inputs.build_ios
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: bash scripts/release/build-mobile-ios.sh

      - name: Sign artifacts
        if: env.HAS_MINISIGN_SECRET_KEY == 'true' && env.HAS_MINISIGN_PASSWORD == 'true'
        env:
          MINISIGN_KEY_FILE: cli-pocket-minisign.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        shell: bash
        run: bash scripts/release/sign.sh dist/

      - name: Upload artifacts
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.name }}
          path: dist/
