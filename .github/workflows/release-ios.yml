name: release ios

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading v)"
        required: true

jobs:
  build:
    uses: ./.github/workflows/release-platform.yml
    with:
      version: ${{ inputs.version }}
      name: ios
      label: iOS
      os: macos-14
      target: aarch64-apple-darwin
      artifact_target: ios
      build_daemon: false
      build_relay: false
      build_desktop: false
      build_web: false
      build_android: false
      build_ios: true
      node_required: true
      tauri_required: true
      wasm_pack_install: none
      tauri_bundles: ""
    secrets: inherit
