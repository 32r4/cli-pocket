name: release macos-x86_64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading v)"
        required: true

jobs:
  build:
    uses: ./.github/workflows/release-platform.yml
    with:
      version: ${{ inputs.version }}
      name: macos-x86_64
      os: macos-15-intel
      target: x86_64-apple-darwin
      build_daemon: true
      build_relay: true
      build_desktop: true
      build_web: false
      build_android: false
      build_ios: false
      node_required: true
      tauri_required: true
      wasm_pack_install: none
      tauri_bundles: dmg,app
    secrets: inherit
