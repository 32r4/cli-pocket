name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading v)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            build_daemon: true
            build_relay: true
            build_desktop: true
            build_web: true
            build_android: false
            build_ios: false
            node_required: true
            tauri_required: true
            wasm_pack_install: shell
            tauri_bundles: deb,rpm,appimage
          - name: linux-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            build_daemon: true
            build_relay: true
            build_desktop: false
            build_web: false
            build_android: false
            build_ios: false
            node_required: false
            tauri_required: false
            wasm_pack_install: none
            tauri_bundles: ""
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            build_daemon: true
            build_relay: true
            build_desktop: true
            build_web: false
            build_android: false
            build_ios: false
            node_required: true
            tauri_required: true
            wasm_pack_install: none
            tauri_bundles: dmg,app
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            build_daemon: true
            build_relay: true
            build_desktop: true
            build_web: false
            build_android: false
            build_ios: true
            node_required: true
            tauri_required: true
            wasm_pack_install: none
            tauri_bundles: dmg,app
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            build_daemon: true
            build_relay: true
            build_desktop: true
            build_web: false
            build_android: false
            build_ios: false
            node_required: true
            tauri_required: true
            wasm_pack_install: none
            tauri_bundles: msi
          - name: android
            os: ubuntu-22.04
            target: android
            build_daemon: false
            build_relay: false
            build_desktop: false
            build_web: false
            build_android: true
            build_ios: false
            node_required: true
            tauri_required: true
            wasm_pack_install: none
            tauri_bundles: ""

    steps:
      - uses: actions/checkout@v4

      - name: Derive VERSION
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check mobile scaffold
        id: mobile
        shell: bash
        run: |
          if [ -f apps/mobile/src-tauri/tauri.conf.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'android' && 'aarch64-linux-android' || matrix.target }}

      - name: Add cross-linker (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - uses: actions/setup-node@v4
        if: matrix.node_required
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webview/terminal/package-lock.json

      - name: Install Tauri prerequisites (linux)
        if: runner.os == 'Linux' && (matrix.build_desktop || matrix.build_android)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libssl-dev pkg-config librsvg2-dev

      - name: Install wasm-pack (unix)
        if: matrix.wasm_pack_install == 'shell' && runner.os != 'Windows'
        shell: bash
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-pack (windows)
        if: matrix.wasm_pack_install == 'shell' && runner.os == 'Windows'
        shell: bash
        run: cargo install wasm-pack --locked

      - name: Install tauri-cli
        if: matrix.tauri_required
        shell: bash
        run: cargo install tauri-cli --version "^2.1" --locked

      - name: Install minisign (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Install minisign (macos)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install minisign

      - name: Install minisign (windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install minisign -y

      - name: Materialise signing key
        if: secrets.MINISIGN_SECRET_KEY != ''
        shell: bash
        env:
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          printf '%s' "$KEY" > cli-pocket-minisign.key
          chmod 600 cli-pocket-minisign.key

      - name: Build daemon
        if: matrix.build_daemon
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: bash scripts/release/build-daemon.sh

      - name: Build relay
        if: matrix.build_relay
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: bash scripts/release/build-relay.sh

      - name: Build desktop
        if: matrix.build_desktop
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAURI_BUNDLES: ${{ matrix.tauri_bundles }}
        shell: bash
        run: bash scripts/release/build-desktop.sh

      - name: Build web
        if: matrix.build_web
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: bash scripts/release/build-web.sh

      - name: Setup Java
        if: matrix.build_android && steps.mobile.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        if: matrix.build_android && steps.mobile.outputs.enabled == 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build mobile (android)
        if: matrix.build_android
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: bash scripts/release/build-mobile-android.sh

      - name: Build mobile (ios)
        if: matrix.build_ios
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: bash scripts/release/build-mobile-ios.sh

      - name: Sign artifacts
        if: secrets.MINISIGN_SECRET_KEY != ''
        env:
          MINISIGN_KEY_FILE: cli-pocket-minisign.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        shell: bash
        run: bash scripts/release/sign.sh dist/

      - name: Upload artifacts
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: aggregated/

      - name: Flatten
        shell: bash
        run: |
          mkdir -p dist
          find aggregated -type f -exec cp -n {} dist/ \;
          ls -lh dist/

      - name: Verify signing secrets exist
        if: ${{ secrets.MINISIGN_SECRET_KEY == '' || secrets.MINISIGN_PASSWORD == '' }}
        shell: bash
        run: |
          echo "MINISIGN_SECRET_KEY and MINISIGN_PASSWORD must both be configured for release publishing." >&2
          exit 1

      - name: Generate SHA256SUMS
        shell: bash
        run: bash scripts/release/sha256sums.sh dist/

      - name: Install minisign
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign SHA256SUMS
        env:
          MINISIGN_KEY_FILE: cli-pocket-minisign.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          printf '%s' "$KEY" > cli-pocket-minisign.key
          chmod 600 cli-pocket-minisign.key
          echo "$MINISIGN_PASSWORD" | minisign -S -s cli-pocket-minisign.key -m dist/SHA256SUMS -t "cli-pocket release"

      - name: Extract minisign public key
        shell: bash
        run: bash scripts/release/extract-public-key.sh docs/release/PUBLIC_KEY.md cli-pocket-minisign.pub

      - name: Verify everything
        env:
          MINISIGN_PUB_FILE: cli-pocket-minisign.pub
        shell: bash
        run: bash scripts/release/verify.sh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*
          body_path: docs/release/VERIFY.md
