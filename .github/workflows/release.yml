name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading v)"
        required: true

permissions:
  contents: read

env:
  HAS_MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
  HAS_MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD != '' }}
  MINISIGN_VERSION: "0.12"

jobs:
  derive-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Derive VERSION
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: derive-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            build_daemon: true
            build_relay: true
            build_desktop: true
            build_web: true
            build_android: false
            build_ios: false
            node_required: true
            tauri_required: true
            wasm_pack_install: shell
            tauri_bundles: deb,rpm,appimage
          - name: linux-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            build_daemon: true
            build_relay: true
            build_desktop: false
            build_web: false
            build_android: false
            build_ios: false
            node_required: false
            tauri_required: false
            wasm_pack_install: none
            tauri_bundles: ""
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            build_daemon: true
            build_relay: true
            build_desktop: true
            build_web: false
            build_android: false
            build_ios: false
            node_required: true
            tauri_required: true
            wasm_pack_install: none
            tauri_bundles: dmg,app
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            build_daemon: true
            build_relay: true
            build_desktop: true
            build_web: false
            build_android: false
            build_ios: false
            node_required: true
            tauri_required: true
            wasm_pack_install: none
            tauri_bundles: dmg,app
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            build_daemon: true
            build_relay: true
            build_desktop: true
            build_web: false
            build_android: false
            build_ios: false
            node_required: true
            tauri_required: true
            wasm_pack_install: none
            tauri_bundles: msi
          - name: android
            os: ubuntu-22.04
            target: android
            build_daemon: false
            build_relay: false
            build_desktop: false
            build_web: false
            build_android: true
            build_ios: false
            node_required: true
            tauri_required: true
            wasm_pack_install: none
            tauri_bundles: ""
          - name: ios
            os: macos-14
            target: aarch64-apple-darwin
            build_daemon: false
            build_relay: false
            build_desktop: false
            build_web: false
            build_android: false
            build_ios: true
            node_required: true
            tauri_required: true
            wasm_pack_install: none
            tauri_bundles: ""
    uses: ./.github/workflows/release-platform.yml
    with:
      version: ${{ needs.derive-version.outputs.version }}
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      build_daemon: ${{ matrix.build_daemon }}
      build_relay: ${{ matrix.build_relay }}
      build_desktop: ${{ matrix.build_desktop }}
      build_web: ${{ matrix.build_web }}
      build_android: ${{ matrix.build_android }}
      build_ios: ${{ matrix.build_ios }}
      node_required: ${{ matrix.node_required }}
      tauri_required: ${{ matrix.tauri_required }}
      wasm_pack_install: ${{ matrix.wasm_pack_install }}
      tauri_bundles: ${{ matrix.tauri_bundles }}
    secrets: inherit

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: aggregated/

      - name: Flatten
        shell: bash
        run: |
          mkdir -p dist
          find aggregated -type f -exec cp -n {} dist/ \;
          ls -lh dist/

      - name: Verify signing secrets exist
        if: env.HAS_MINISIGN_SECRET_KEY != 'true' || env.HAS_MINISIGN_PASSWORD != 'true'
        shell: bash
        run: |
          echo "MINISIGN_SECRET_KEY and MINISIGN_PASSWORD must both be configured for release publishing." >&2
          exit 1

      - name: Generate SHA256SUMS
        shell: bash
        run: bash scripts/release/sha256sums.sh dist/

      - name: Install minisign
        shell: bash
        run: |
          curl -fsSL -o minisign.tar.gz "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz"
          tar -xzf minisign.tar.gz
          sudo install -m 755 "minisign-linux/$(uname -m)/minisign" /usr/local/bin/minisign

      - name: Sign SHA256SUMS
        env:
          MINISIGN_KEY_FILE: cli-pocket-minisign.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          printf '%s' "$KEY" > cli-pocket-minisign.key
          chmod 600 cli-pocket-minisign.key
          echo "$MINISIGN_PASSWORD" | minisign -S -s cli-pocket-minisign.key -m dist/SHA256SUMS -t "cli-pocket release"

      - name: Extract minisign public key
        shell: bash
        run: bash scripts/release/extract-public-key.sh docs/release/PUBLIC_KEY.md cli-pocket-minisign.pub

      - name: Verify everything
        env:
          MINISIGN_PUB_FILE: cli-pocket-minisign.pub
        shell: bash
        run: bash scripts/release/verify.sh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.derive-version.outputs.version }}
          name: v${{ needs.derive-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*
          body_path: docs/release/VERIFY.md
