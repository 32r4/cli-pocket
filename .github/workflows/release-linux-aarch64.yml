name: release linux-aarch64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading v)"
        required: true

jobs:
  build:
    uses: ./.github/workflows/release-platform.yml
    with:
      version: ${{ inputs.version }}
      name: linux-aarch64
      label: Linux arm64
      os: ubuntu-22.04
      target: aarch64-unknown-linux-gnu
      artifact_target: linux-arm64
      build_daemon: true
      build_relay: true
      build_desktop: false
      build_web: false
      build_android: false
      build_ios: false
      node_required: false
      tauri_required: false
      wasm_pack_install: none
      tauri_bundles: ""
    secrets: inherit
