[package]
name = "cli-pocket-mobile"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[package.metadata]

[lib]
name = "cli_pocket_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-runtime-wry = { version = "=2.11.2", features = [] }
tauri-plugin-deep-link = { version = "=2.4.9", features = [] }

cli-pocket-client-core = { path = "../../../crates/client/client-core" }
cli-pocket-proto = { path = "../../../crates/shared/proto" }
cli-pocket-tauri-bindings = { path = "../../../crates/client/tauri-bindings" }

base64 = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = { version = "0.4", features = [] }
postcard = { workspace = true }
uuid = { workspace = true }
