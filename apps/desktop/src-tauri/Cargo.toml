[package]
name = "cli-pocket-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "cli_pocket_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-runtime-wry = "=2.11.2"
tauri-plugin-deep-link = "=2.4.9"

cli-pocket-client-core = { path = "../../../crates/client/client-core" }
cli-pocket-daemon-core = { path = "../../../crates/server/daemon-core" }
cli-pocket-proto = { path = "../../../crates/shared/proto" }
cli-pocket-tauri-bindings = { path = "../../../crates/client/tauri-bindings" }

base64 = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
postcard = { workspace = true }
uuid = { workspace = true }
