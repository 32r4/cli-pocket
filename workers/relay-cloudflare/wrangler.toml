name = "cli-pocket-relay"
main = "src/index.ts"
compatibility_date = "2026-05-29"
routes = [{ pattern = "relay.cli-pocket.32r4.asia", custom_domain = true }]

[observability]
enabled = true

[vars]
MAX_SERVERS = "256"
MAX_PAIRS = "2048"
MAX_BYTES_PER_SEC = "4194304"
MAX_QUEUED_BYTES = "8388608"
IDLE_SECONDS = "120"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelaySessionDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelaySessionDurableObject"]
