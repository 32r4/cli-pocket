[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    "RUSTSEC-2024-0411", # gdkwayland-sys via tauri/wry GTK3 stack
    "RUSTSEC-2024-0412", # gdk via tauri/wry GTK3 stack
    "RUSTSEC-2024-0413", # atk via tauri/wry GTK3 stack
    "RUSTSEC-2024-0414", # gdkx11-sys via tauri/wry GTK3 stack
    "RUSTSEC-2024-0415", # gtk via tauri/wry GTK3 stack
    "RUSTSEC-2024-0416", # atk-sys via tauri/wry GTK3 stack
    "RUSTSEC-2024-0417", # gdkx11 via tauri/wry GTK3 stack
    "RUSTSEC-2024-0418", # gdk-sys via tauri/wry GTK3 stack
    "RUSTSEC-2024-0419", # gtk3 stack pulled by tauri/wry on desktop targets
    "RUSTSEC-2024-0420", # gtk-sys via tauri/wry GTK3 stack
    "RUSTSEC-2024-0370", # proc-macro-error via gtk/glib macro stack
    "RUSTSEC-2025-0075", # unic-char-range via tauri-utils/urlpattern
    "RUSTSEC-2025-0080", # unic-common via tauri-utils/urlpattern
    "RUSTSEC-2025-0081", # unic-char-property via tauri-utils/urlpattern
    "RUSTSEC-2025-0098", # unic-ucd-version via tauri-utils/urlpattern
    "RUSTSEC-2025-0100", # unic-ucd-ident via tauri-utils/urlpattern
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "AGPL-3.0-only",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "base64@0.21.7", reason = "Pinned by Tauri/swift-rs stack; workspace uses 0.22.x directly." },
    { crate = "bitflags@1.3.2", reason = "Pinned by Tauri GTK/WebKit and portable-pty transitive dependencies." },
    { crate = "winnow@0.5.40", reason = "Pinned by older GTK/Tauri proc-macro stack." },
    { crate = "winnow@0.7.15", reason = "Pinned by current toml 0.9 dependency chain." },
    { crate = "winreg@0.10.1", reason = "Pinned by portable-pty on Windows; Tauri build stack uses newer winreg." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
