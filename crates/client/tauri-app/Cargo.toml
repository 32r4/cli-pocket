[package]
name = "cli-pocket-tauri-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-deep-link = { version = "=2.4.9", features = [] }

cli-pocket-client-core = { path = "../client-core" }
cli-pocket-proto = { path = "../../shared/proto" }
cli-pocket-tauri-bindings = { path = "../tauri-bindings" }

base64 = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
postcard = { workspace = true }
uuid = { workspace = true }
