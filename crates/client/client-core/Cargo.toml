[package]
name = "cli-pocket-client-core"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Platform-agnostic client state machine for cli-pocket."

[dependencies]
cli-pocket-proto  = { path = "../../shared/proto" }
cli-pocket-crypto = { path = "../../shared/crypto" }

async-trait  = { workspace = true }
bytes        = { workspace = true }
futures-channel = { version = "0.3", features = ["sink"] }
futures-util = { workspace = true, features = ["sink"] }
hex          = "0.4"
serde        = { workspace = true }
serde_json   = { workspace = true }
snow         = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
uuid         = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cli-pocket-transport = { path = "../../shared/transport" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
