[package]
name = "cli-pocket-daemon-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "cli-pocket daemon library: session manager, Noise responder, terminal routing."
publish = false

[dependencies]
cli-pocket-proto      = { path = "../../shared/proto" }
cli-pocket-crypto     = { path = "../../shared/crypto" }
cli-pocket-transport  = { path = "../../shared/transport" }
cli-pocket-pty        = { path = "../pty" }
async-trait           = { workspace = true }
base64                = { workspace = true }
bytes                 = { workspace = true }
futures-util          = "0.3"
getrandom             = { workspace = true }
hex                   = "0.4"
hmac                  = "0.12"
parking_lot           = "0.12"
serde                 = { workspace = true }
serde_json            = { workspace = true }
sha2                  = "0.10"
subtle                = "2"
thiserror             = { workspace = true }
tokio                 = { workspace = true, features = ["sync", "net", "rt-multi-thread"] }
tokio-tungstenite     = { workspace = true }
toml                  = { workspace = true }
tracing               = "0.1"
uuid                  = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cli-pocket-relay-core = { path = "../../relay/relay-core" }
axum = { version = "=0.7.9", features = ["ws", "macros"] }
