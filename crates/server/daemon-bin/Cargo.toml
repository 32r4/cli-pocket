[package]
name = "cli-pocket-daemon"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "cli-pocket daemon binary."

[[bin]]
name = "cli-pocket-daemon"
path = "src/main.rs"

[dependencies]
cli-pocket-daemon-core = { path = "../daemon-core" }
cli-pocket-crypto      = { path = "../../shared/crypto" }
cli-pocket-proto       = { path = "../../shared/proto" }

anyhow             = "1"
clap               = { workspace = true }
getrandom          = { workspace = true }
hex                = "0.4"
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls             = { version = "0.23.40", default-features = false, features = ["std", "aws_lc_rs"] }
uuid               = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
