[package]
name = "cli-pocket-relay-core"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "cli-pocket relay library: host registry, pair manager, ciphertext forwarder."

[lints]
workspace = true

[dependencies]
cli-pocket-proto = { path = "../../shared/proto" }
cli-pocket-transport = { path = "../../shared/transport" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-tungstenite = { workspace = true }
axum = { version = "=0.7.9", features = ["ws", "macros"] }
tower = "0.5"
hyper = "1"
hyper-util = { version = "0.1", features = ["server"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "=0.8.23"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
tracing = { workspace = true }
parking_lot = "0.12"
thiserror = { workspace = true }
anyhow = "1"
bytes = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "time"] }
reqwest = { version = "=0.12.12", default-features = false, features = ["json"] }
tokio-tungstenite = { workspace = true }
tempfile = "3"
